<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b36"><title>Continuum | Care operations</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,Arial;color:#18333b;background:#f3f7f7}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #5ac6b3;outline-offset:2px}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{background:#102b36;color:#d4e6e7;padding:28px 16px;display:flex;flex-direction:column;gap:8px}.brand{font-size:24px;font-weight:800;color:#fff;letter-spacing:-1px;margin:0 12px 35px}.brand span{color:#68d9c1}.nav{background:none;border:0;color:inherit;text-align:left;padding:13px 16px;border-radius:10px;width:100%}.nav.active,.nav:hover{background:#214b54;color:#fff}.small{font-size:12px;color:#8daeb6}.aside-bottom{margin-top:auto;padding:14px}main{min-width:0;padding:34px clamp(18px,4vw,58px)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}h1{font-size:29px;letter-spacing:-.8px;margin:5px 0}h2{font-size:18px;margin:0 0 16px}p{line-height:1.5}.muted{color:#6e858a}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:#398b81;font-weight:800}.button{border:0;background:#167f75;color:white;border-radius:9px;padding:11px 16px;font-weight:700}.button.secondary{background:white;color:#22515a;border:1px solid #cfdfdf}.button:disabled{opacity:.5;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.panel,.stat{background:white;border:1px solid #e1eaea;border-radius:15px;padding:22px;box-shadow:0 3px 12px #163c4108}.stat strong{display:block;font-size:32px;margin:9px 0 2px}.stat .muted{font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:18px;margin-top:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #edf1f1}.row:last-child{border:0}.person{font-weight:750}.pill{font-size:12px;font-weight:700;padding:5px 9px;border-radius:99px;background:#e5f6f0;color:#177463;white-space:nowrap}.pill.high{background:#fff0e8;color:#bd5938}.pill.medium{background:#fff6df;color:#9c720f}.pill.low{background:#e5f6f0;color:#177463}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}.field{border:1px solid #d4e0e0;border-radius:9px;background:white;padding:11px 12px;min-width:0}input.field{flex:1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:15px;border-bottom:1px solid #edf1f1;white-space:nowrap}th{color:#71858b;font-size:12px;text-transform:uppercase;letter-spacing:.5px}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:#f4faf8}.detail{display:grid;grid-template-columns:1fr 1fr;gap:18px}.timeline{border-left:2px solid #c5e7e1;padding-left:20px}.event{position:relative;margin-bottom:24px}.event:before{content:'';position:absolute;left:-27px;top:4px;width:12px;height:12px;border-radius:50%;background:#168779}.event p{margin:5px 0}.stack{display:grid;gap:12px}label{font-size:13px;font-weight:700;display:grid;gap:7px}textarea{min-height:95px;resize:vertical}form{display:grid;gap:14px;max-width:720px}.notice{padding:13px 16px;background:#e8f7f4;color:#28695e;border-radius:10px;font-size:13px}.empty{text-align:center;padding:38px;color:#72868b}.hidden{display:none!important}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.layout,.detail{grid-template-columns:1fr}}@media(max-width:680px){.app{display:block}aside{padding:12px;flex-direction:row;overflow:auto;align-items:center;gap:4px}.brand{font-size:18px;margin:0 12px 0 0;white-space:nowrap}.nav{width:auto;white-space:nowrap;padding:10px}.aside-bottom{display:none}main{padding:22px 15px}.grid{grid-template-columns:1fr 1fr}.stat{padding:16px}.stat strong{font-size:25px}header{margin-bottom:18px}h1{font-size:25px}}
</style></head><body><div class="app"><aside><div class="brand">continu<span>um.</span></div><button class="nav active" data-page="overview">Overview</button><button class="nav" data-page="patients">Patients</button><button class="nav" data-page="calls">Check-in calls</button><button class="nav" data-page="alerts">Care alerts</button><button class="nav" data-page="enroll">Enroll patient</button><button class="nav" data-workspace="plans">Care plans</button><button class="nav" data-workspace="tasks">Follow-up tasks</button><button class="nav" data-workspace="schedule">Outreach schedule</button><button class="nav" data-workspace="analytics">Analytics</button><div class="aside-bottom"><div class="small">USM Hatchathon 2026</div><div class="small">Prototype · fictional data</div></div></aside><main><header><div><div class="eyebrow">Clinical care coordination</div><h1 id="heading">Care overview</h1><div class="muted" id="subtitle">Keep every patient connected between visits.</div></div><button class="button" id="add">+ Enroll patient</button></header><div id="content"></div></main></div>
<script>
const seed=[{id:1,name:'Margaret Ellis',age:74,condition:'Heart failure',frequency:'Every 3 days',last:'Today, 9:20 AM',status:'High',note:'Reported increased shortness of breath',calls:12},{id:2,name:'Robert Chen',age:68,condition:'Type 2 diabetes',frequency:'Weekly',last:'Today, 10:15 AM',status:'Low',note:'Feeling well; medication routine confirmed',calls:8},{id:3,name:'Patricia Gomez',age:81,condition:'COPD',frequency:'Every 3 days',last:'Yesterday, 2:30 PM',status:'Medium',note:'Reported mild cough; nurse review requested',calls:16},{id:4,name:'James Wilson',age:72,condition:'Hypertension',frequency:'Weekly',last:'Yesterday, 11:00 AM',status:'Low',note:'No new concerns reported',calls:6},{id:5,name:'Dorothy Harris',age:77,condition:'Post-discharge recovery',frequency:'Daily',last:'Today, 8:45 AM',status:'Medium',note:'Missed medication reminder; follow-up pending',calls:4}];
const storage='continuum-demo-v1';let db;try{db=JSON.parse(localStorage.getItem(storage))}catch{}if(!db||!Array.isArray(db.patients))db={patients:seed,alerts:[{id:1,patient:1,text:'Shortness of breath reported during check-in',level:'High',state:'Open'},{id:2,patient:3,text:'New cough requires nurse review',level:'Medium',state:'Open'},{id:3,patient:5,text:'Medication adherence follow-up',level:'Medium',state:'Open'}],events:[]};const save=()=>localStorage.setItem(storage,JSON.stringify(db));const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const patient=id=>db.patients.find(p=>p.id===Number(id));const pill=s=>'<span class="pill '+esc(s).toLowerCase()+'">'+esc(s)+'</span>';const panel=(title,body)=>'<section class="panel"><h2>'+title+'</h2>'+body+'</section>';const row=(title,desc,right)=>'<div class="row"><div><div class="person">'+title+'</div><div class="muted" style="font-size:13px;margin-top:4px">'+desc+'</div></div>'+right+'</div>';const stats=()=>'<div class="grid">'+[['Enrolled patients',db.patients.length,'In active follow-up'],['Calls completed',db.patients.reduce((a,p)=>a+p.calls,0),'Simulated call history'],['Open alerts',db.alerts.filter(a=>a.state==='Open').length,'Awaiting clinical review'],['High-priority alerts',db.alerts.filter(a=>a.state==='Open'&&a.level==='High').length,'Require prompt assessment']].map(([a,b,c])=>'<div class="stat"><div class="muted">'+a+'</div><strong>'+b+'</strong><div class="muted">'+c+'</div></div>').join('')+'</div>';let page='overview',selected=null;function render(next=page){page=next;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));const headings={overview:['Care overview','Keep every patient connected between visits.'],patients:['Patient directory','Monitor care plans and longitudinal check-in history.'],calls:['Check-in calls','Review simulated conversations and schedule follow-ups.'],alerts:['Care alerts','Human-reviewed follow-up queue, not automated diagnosis.'],enroll:['Enroll a patient','Set up a new continuity-of-care check-in plan.'],detail:['Patient profile','A longitudinal view of care and engagement.']};$('#heading').textContent=headings[page][0];$('#subtitle').textContent=headings[page][1];$('#add').style.display=page==='enroll'?'none':'';let html='';if(page==='overview'){html=stats()+'<div class="layout">'+panel('Patients needing attention',db.patients.filter(p=>p.status!=='Low').map(p=>row('<button class="nav" style="color:#1a5558;padding:0" data-open="'+p.id+'">'+esc(p.name)+'</button>',esc(p.note),pill(p.status))).join('')||'<div class="empty">No active concerns</div>')+panel('Recent check-ins',db.patients.slice(0,5).map(p=>row(esc(p.name),esc(p.last),pill(p.status))).join(''))+'</div><div class="notice" style="margin-top:18px">Demo environment: all patients and events are fictional. No clinical decisions or real phone calls occur.</div>'}if(page==='patients'){html=panel('All patients','<div class="toolbar"><input class="field" id="search" placeholder="Search name or condition" aria-label="Search patients"><select class="field" id="filter" aria-label="Filter by risk"><option value="">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select></div><div class="tablewrap"><table><thead><tr><th>Patient</th><th>Age</th><th>Care focus</th><th>Check-in cadence</th><th>Last contact</th><th>Priority</th></tr></thead><tbody id="patientrows"></tbody></table></div>')}if(page==='calls'){html=panel('Check-in activity',db.patients.map(p=>row(esc(p.name),esc(p.last)+' · '+esc(p.note),'<button class="button secondary" data-call="'+p.id+'">Simulate call</button>')).join(''))+'<div class="notice" style="margin-top:16px">Simulation creates a local timeline event only. Telephony, transcription, consent and clinician escalation integrations are not connected.</div>'}if(page==='alerts'){html=panel('Clinical review queue',db.alerts.map(a=>row(esc(patient(a.patient)?.name||'Unknown patient'),esc(a.text)+' · '+esc(a.state),'<div style="display:flex;align-items:center;gap:8px">'+pill(a.level)+(a.state==='Open'?'<button class="button secondary" data-resolve="'+a.id+'">Mark reviewed</button>':'')+'</div>')).join('')||'<div class="empty">No alerts</div>')}if(page==='enroll'){html=panel('New patient','<form id="enrollform"><label>Full name<input required maxlength="100" class="field" name="name" placeholder="Patient name"></label><label>Age<input required min="18" max="120" type="number" class="field" name="age"></label><label>Primary care focus<input required maxlength="100" class="field" name="condition" placeholder="e.g. Post-discharge follow-up"></label><label>Call frequency<select class="field" name="frequency"><option>Daily</option><option>Every 3 days</option><option>Weekly</option></select></label><div class="notice">Demo only. Do not enter real patient information. Enrollment is stored in this browser, not a clinical system.</div><button class="button" type="submit">Enroll demo patient</button></form>')}if(page==='detail'){const p=patient(selected);if(!p)return render('patients');const events=db.events.filter(e=>e.patient===p.id);html='<button class="button secondary" id="back">← All patients</button><div class="detail" style="margin-top:18px">'+panel(esc(p.name),'<p class="muted">'+p.age+' years · '+esc(p.condition)+'</p>'+row('Care priority','Current triage status',pill(p.status))+row('Check-in schedule',esc(p.frequency),'')+row('Most recent contact',esc(p.last),'')+'<button class="button" data-call="'+p.id+'">Simulate check-in</button>')+panel('Continuity timeline','<div class="timeline">'+events.slice().reverse().map(e=>'<div class="event"><strong>'+esc(e.type)+'</strong><p>'+esc(e.note)+'</p><div class="small">'+esc(e.date)+'</div></div>').join('')+'<div class="event"><strong>Last check-in</strong><p>'+esc(p.note)+'</p><div class="small">'+esc(p.last)+'</div></div><div class="event"><strong>Patient enrolled</strong><p>Continuity monitoring initiated</p></div></div>')+'</div>'}$('#content').innerHTML=html;if(page==='patients'){const update=()=>{const q=$('#search').value.toLowerCase(),f=$('#filter').value;$('#patientrows').innerHTML=db.patients.filter(p=>(p.name+' '+p.condition).toLowerCase().includes(q)&&(!f||p.status===f)).map(p=>'<tr data-id="'+p.id+'" tabindex="0" aria-label="Open '+esc(p.name)+'"><td><strong>'+esc(p.name)+'</strong></td><td>'+p.age+'</td><td>'+esc(p.condition)+'</td><td>'+esc(p.frequency)+'</td><td>'+esc(p.last)+'</td><td>'+pill(p.status)+'</td></tr>').join('')||'<tr><td colspan="6" class="empty">No matching patients</td></tr>'};$('#search').oninput=update;$('#filter').onchange=update;update()}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav)return render(nav.dataset.page);const open=e.target.closest('[data-open],[data-id]');if(open){selected=Number(open.dataset.open||open.dataset.id);return render('detail')}if(e.target.id==='back')return render('patients');const call=e.target.closest('[data-call]');if(call){const p=patient(call.dataset.call);p.calls++;p.last='Just now (simulated)';db.events.push({patient:p.id,type:'Simulated check-in',note:'Demo call completed; no actual call or clinical assessment occurred.',date:new Date().toLocaleString()});save();render();return}const resolve=e.target.closest('[data-resolve]');if(resolve){const a=db.alerts.find(a=>a.id===Number(resolve.dataset.resolve));a.state='Reviewed';db.events.push({patient:a.patient,type:'Alert reviewed',note:a.text,date:new Date().toLocaleString()});save();render()}});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('tr[data-id]')){selected=Number(e.target.dataset.id);render('detail')}});document.addEventListener('submit',e=>{if(e.target.id!=='enrollform')return;e.preventDefault();const f=new FormData(e.target);const p={id:Math.max(0,...db.patients.map(x=>x.id))+1,name:String(f.get('name')).trim(),age:Number(f.get('age')),condition:String(f.get('condition')).trim(),frequency:String(f.get('frequency')),last:'Not contacted',status:'Low',note:'Awaiting first check-in',calls:0};if(!p.name||!p.condition||p.age<18||p.age>120)return;db.patients.push(p);save();selected=p.id;render('detail')});$('#add').onclick=()=>render('enroll');render();
</script>
<script>
/* Extended demo operations workspace. All records are fictional and browser-local. */
(function(){
const key='continuum-workspace-v2';
let state;try{state=JSON.parse(localStorage.getItem(key))}catch{}
if(!state||!Array.isArray(state.plans))state={
plans:[{id:1,patient:1,goal:'Monitor breathing changes',owner:'Care coordinator',status:'Active',instructions:'Review patient-reported concerns with a licensed clinician.'},{id:2,patient:2,goal:'Weekly medication adherence check-in',owner:'Nursing team',status:'Active',instructions:'Confirm whether medication questions need clinician review.'},{id:3,patient:5,goal:'Post-discharge recovery follow-up',owner:'Discharge team',status:'Active',instructions:'Escalate new concerns to the assigned care team.'}],
tasks:[{id:1,patient:1,title:'Review reported breathing concern',owner:'Nursing team',priority:'High',due:'2026-11-09',status:'Open'},{id:2,patient:3,title:'Follow up on cough report',owner:'Care coordinator',priority:'Medium',due:'2026-11-10',status:'Open'},{id:3,patient:5,title:'Discuss missed medication reminder',owner:'Nursing team',priority:'Medium',due:'2026-11-10',status:'Open'}],
schedule:[{id:1,patient:1,date:'2026-11-09',time:'09:00',channel:'Voice call',status:'Scheduled'},{id:2,patient:2,date:'2026-11-11',time:'10:00',channel:'Voice call',status:'Scheduled'},{id:3,patient:5,date:'2026-11-09',time:'11:30',channel:'Voice call',status:'Scheduled'}]};
const persist=()=>localStorage.setItem(key,JSON.stringify(state));
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c]));
const who=id=>db.patients.find(p=>p.id===Number(id))?.name||'Unknown patient';
const options=()=>db.patients.map(p=>'<option value="'+p.id+'">'+safe(p.name)+'</option>').join('');
const card=(heading,body)=>'<section class="panel"><h2>'+heading+'</h2>'+body+'</section>';
const tag=s=>'<span class="pill '+safe(s).toLowerCase()+'">'+safe(s)+'</span>';
const formfield=(label,field)=>'<label>'+label+field+'</label>';
const input=(name,type='text',required=true)=>'<input class="field" name="'+name+'" type="'+type+'" '+(required?'required':'')+'>';
const selection=(name,values)=>'<select class="field" name="'+name+'">'+values.map(v=>'<option>'+safe(v)+'</option>').join('')+'</select>';
let active=null;
function show(section){
active=section;
document.querySelectorAll('aside .nav').forEach(b=>b.classList.toggle('active',b.dataset.workspace===section));
const names={plans:['Care plans','Coordinate ongoing patient goals and clinician-reviewed interventions.'],tasks:['Follow-up tasks','Track ownership, deadlines and completion of care coordination work.'],schedule:['Outreach schedule','Plan patient check-ins without initiating real calls.'],analytics:['Operations analytics','Demo metrics based on locally stored fictional records.']};
document.querySelector('#heading').textContent=names[section][0];
document.querySelector('#subtitle').textContent=names[section][1];
document.querySelector('#add').style.display='none';
let out='';
if(section==='plans'){
out='<div class="layout">'+card('Active care plans',state.plans.map(p=>'<div class="row"><div><strong>'+safe(who(p.patient))+'</strong><p>'+safe(p.goal)+'</p><div class="small">Owner: '+safe(p.owner)+' · '+safe(p.instructions)+'</div></div><div>'+tag(p.status)+' <button class="button secondary" data-plan="'+p.id+'">'+(p.status==='Active'?'Complete':'Reopen')+'</button></div></div>').join('')||'<div class="empty">No care plans</div>')+card('Create care plan','<form data-form="plan">'+formfield('Patient','<select class="field" name="patient">'+options()+'</select>')+formfield('Goal',input('goal'))+formfield('Responsible team',input('owner'))+formfield('Care coordination instructions','<textarea class="field" name="instructions" required></textarea>')+'<button class="button">Add care plan</button></form>')+'</div>';
}
if(section==='tasks'){
out='<div class="layout">'+card('Task queue',state.tasks.map(t=>'<div class="row"><div><strong>'+safe(t.title)+'</strong><div class="muted">'+safe(who(t.patient))+' · '+safe(t.owner)+' · Due '+safe(t.due)+'</div></div><div>'+tag(t.priority)+' '+tag(t.status)+' <button class="button secondary" data-task="'+t.id+'">'+(t.status==='Open'?'Complete':'Reopen')+'</button></div></div>').join('')||'<div class="empty">No tasks</div>')+card('New follow-up task','<form data-form="task">'+formfield('Patient','<select class="field" name="patient">'+options()+'</select>')+formfield('Task',input('title'))+formfield('Owner',input('owner'))+formfield('Due date',input('due','date'))+formfield('Priority',selection('priority',['Low','Medium','High']))+'<button class="button">Create task</button></form>')+'</div>';
}
if(section==='schedule'){
out='<div class="layout">'+card('Scheduled outreach',state.schedule.map(s=>'<div class="row"><div><strong>'+safe(who(s.patient))+'</strong><div class="muted">'+safe(s.date)+' at '+safe(s.time)+' · '+safe(s.channel)+'</div></div><div>'+tag(s.status)+' <button class="button secondary" data-schedule="'+s.id+'">'+(s.status==='Scheduled'?'Mark completed':'Reschedule')+'</button></div></div>').join('')||'<div class="empty">No scheduled outreach</div>')+card('Schedule check-in','<form data-form="schedule">'+formfield('Patient','<select class="field" name="patient">'+options()+'</select>')+formfield('Date',input('date','date'))+formfield('Time',input('time','time'))+formfield('Channel',selection('channel',['Voice call','Staff outreach']))+'<button class="button">Schedule check-in</button></form>')+'</div><div class="notice" style="margin-top:16px">Scheduling is illustrative only: no outbound communication will occur.</div>';
}
if(section==='analytics'){
const total=db.patients.reduce((a,p)=>a+p.calls,0),open=state.tasks.filter(t=>t.status==='Open').length,done=state.tasks.filter(t=>t.status==='Done').length;
out='<div class="grid">'+[['Enrolled patients',db.patients.length],['Demo calls logged',total],['Open tasks',open],['Completed tasks',done]].map(([name,value])=>'<div class="stat"><div class="muted">'+name+'</div><strong>'+value+'</strong></div>').join('')+'</div><div class="layout">'+card('Care priority distribution',['High','Medium','Low'].map(level=>'<div class="row"><strong>'+level+'</strong><span>'+db.patients.filter(p=>p.status===level).length+' patients</span></div>').join(''))+card('Care coordination workload','<div class="row"><strong>Care plans</strong><span>'+state.plans.length+'</span></div><div class="row"><strong>Scheduled outreach</strong><span>'+state.schedule.filter(s=>s.status==='Scheduled').length+'</span></div><div class="row"><strong>Task completion</strong><span>'+ (state.tasks.length?Math.round(done/state.tasks.length*100):0)+'%</span></div>')+'</div><div class="notice" style="margin-top:16px">These are synthetic demonstration metrics, not clinical outcomes or real service performance.</div>';
}
document.querySelector('#content').innerHTML=out;
}
document.addEventListener('click',function(e){
const b=e.target.closest('[data-workspace]');if(b){e.preventDefault();e.stopImmediatePropagation();show(b.dataset.workspace);return}
if(e.target.closest('aside [data-page]')){active=null;return}
if(!active)return;
const p=e.target.closest('[data-plan]'),t=e.target.closest('[data-task]'),s=e.target.closest('[data-schedule]');
if(p){const v=state.plans.find(x=>x.id===Number(p.dataset.plan));v.status=v.status==='Active'?'Completed':'Active'}
else if(t){const v=state.tasks.find(x=>x.id===Number(t.dataset.task));v.status=v.status==='Open'?'Done':'Open'}
else if(s){const v=state.schedule.find(x=>x.id===Number(s.dataset.schedule));v.status=v.status==='Scheduled'?'Completed':'Scheduled'}
else return;
persist();show(active);
},true);
document.addEventListener('submit',function(e){
const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();e.stopImmediatePropagation();
const data=Object.fromEntries(new FormData(f));const type=f.dataset.form;
if(type==='plan'){state.plans.push({id:Date.now(),patient:Number(data.patient),goal:data.goal.trim(),owner:data.owner.trim(),instructions:data.instructions.trim(),status:'Active'})}
if(type==='task'){state.tasks.push({id:Date.now(),patient:Number(data.patient),title:data.title.trim(),owner:data.owner.trim(),due:data.due,priority:data.priority,status:'Open'})}
if(type==='schedule'){state.schedule.push({id:Date.now(),patient:Number(data.patient),date:data.date,time:data.time,channel:data.channel,status:'Scheduled'})}
persist();show(active);
},true);
})();
</script></body></html>
